# pnpm 10+ settings file (not a workspace: this is a single package).
# Build scripts are skipped by default; sharp needs its postinstall.
allowBuilds:
  sharp: true
  unrs-resolver: true

# Security floors for transitive packages (from `pnpm audit`). Each key targets
# only the affected range, and each value stays inside the same major so no
# consumer is handed an incompatible release. Remove an entry once the direct
# dependency ships the patched version on its own.
overrides:
  'baseline-browser-mapping@<2.11.0': '^2.11.0'
  'brace-expansion@1': '^1.1.21'
  'brace-expansion@5': '^5.0.12'
  'browserslist@<4.28.7': '^4.28.7'
  'follow-redirects@<1.16.1': '^1.16.1'
  'nanoid@<3.3.18': '^3.3.18'
  'postcss-selector-parser@<6.1.5': '^6.1.5'
  'source-map-js@<1.2.2': '^1.2.2'
  'zod@<4.6.6': '^4.6.6'
